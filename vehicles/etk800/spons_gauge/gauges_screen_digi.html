<body ng-controller="GaugesScreenController as gaugeCtrl">

  <style>
    @import url("/ui/ui-vue/src/styles/other/navigator.css");

    body {
      margin: 0;
      background: #05070b;
      color: white;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .gauge {
      position: relative;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      background:
        radial-gradient(circle at center, rgba(70, 78, 92, 0.22) 0%, rgba(10, 13, 19, 0.95) 48%, #020305 100%);
    }

    .dial {
      position: absolute;
      top: 64%;
      width: 30vw;
      height: 30vw;
      max-width: 430px;
      max-height: 430px;
      min-width: 250px;
      min-height: 250px;
      border-radius: 50%;
      transform: translateY(-50%);
      background:
        radial-gradient(circle at center, #151b25 0%, #0c1119 51%, #05070b 74%);
      box-shadow:
        0 0 34px rgba(255, 255, 255, 0.08),
        inset 0 0 44px rgba(255, 255, 255, 0.06);
    }

    .rpm-dial {
      left: 4.5vw;
    }

    .speed-dial {
      right: 4.5vw;
    }

    .dial::before {
      content: "";
      position: absolute;
      inset: 5.5%;
      border-radius: 50%;
      background:
        conic-gradient(
          from -125deg,
          rgba(230, 236, 245, 0.28) 0deg,
          rgba(230, 236, 245, 0.28) 250deg,
          transparent 250deg,
          transparent 360deg
        );
      -webkit-mask: radial-gradient(circle, transparent 68.5%, black 69%, black 70%, transparent 70.5%);
      mask: radial-gradient(circle, transparent 68.5%, black 69%, black 70%, transparent 70.5%);
    }

    .dial::after {
      content: "";
      position: absolute;
      inset: 15%;
      border-radius: 50%;
      border: 1px solid rgba(220, 228, 240, 0.13);
    }

    .tick {
      position: absolute;
      inset: 0;
      transform: rotate(var(--a));
      z-index: 2;
    }

    .tick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 4.5%;
      width: 3px;
      height: 12%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(230, 236, 245, 0.82);
      box-shadow: 0 0 10px rgba(230, 236, 245, 0.55);
    }

    .tick.minor::before {
      top: 6%;
      width: 1px;
      height: 7%;
      background: rgba(230, 236, 245, 0.34);
      box-shadow: none;
    }

    .num {
      position: absolute;
      inset: 0;
      transform: rotate(var(--a));
      z-index: 3;
    }

    .num span {
      position: absolute;
      left: 50%;
      top: 20%;
      transform: translate(-50%, -50%) rotate(var(--ia));
      color: rgba(230, 236, 245, 0.88);
      font-size: clamp(13px, 1.25vw, 22px);
      font-weight: 500;
      letter-spacing: 0.03em;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.32);
    }

    .needle {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      transition: transform 0.12s linear;
      z-index: 5;
      pointer-events: none;
    }

    .needle-arm {
      position: absolute;
      left: 50%;
      top: 10%;
      width: 3px;
      height: 34%;
      transform: translateX(-50%);
      border-radius: 999px;
      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(255, 210, 210, 0.95) 48%,
          rgba(255, 55, 55, 0.95) 100%
        );
      box-shadow:
        0 0 8px rgba(255, 255, 255, 0.62),
        0 0 18px rgba(255, 70, 70, 0.72);
    }

    .readout-shield {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 39%;
      height: 39%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(22, 28, 38, 0.98) 0%, rgba(16, 21, 30, 0.96) 54%, rgba(16, 21, 30, 0.72) 73%, transparent 100%);
      box-shadow:
        0 0 28px rgba(10, 14, 22, 0.95),
        inset 0 0 28px rgba(255, 255, 255, 0.035);
      z-index: 7;
    }

    .dial-title {
      position: absolute;
      top: 31%;
      width: 100%;
      text-align: center;
      z-index: 8;
      font-size: clamp(13px, 1.05vw, 20px);
      letter-spacing: 0.42em;
      color: rgba(220, 228, 240, 0.88);
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.24);
    }

    .dial-value {
      position: absolute;
      top: 43%;
      width: 100%;
      text-align: center;
      z-index: 8;
      font-size: clamp(42px, 4.8vw, 78px);
      font-weight: 300;
      line-height: 1;
      color: rgba(245, 248, 255, 0.96);
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.24);
    }

    .dial-unit {
      position: absolute;
      top: 61%;
      width: 100%;
      text-align: center;
      z-index: 8;
      font-size: clamp(13px, 1.35vw, 23px);
      letter-spacing: 0.36em;
      color: rgba(220, 228, 240, 0.88);
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.18);
    }

    .gps-screen {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 512px;
      height: 256px;
      transform: translate(-50%, -50%);
      border-radius: 22px;
      overflow: hidden;
      background: #555;
      border: 2px solid rgba(235, 240, 248, 0.18);
      box-shadow:
        0 0 34px rgba(255, 255, 255, 0.08),
        inset 0 0 32px rgba(255, 255, 255, 0.05);
      z-index: 12;
    }

    .gps-original-root {
      height: 100%;
      width: 100%;
      position: relative;
      background: #555;
    }

    .gps-original-overlay {
      width: 100%;
      height: 100%;
      z-index: 10;
      position: absolute;
      pointer-events: none;
    }

    .gps-original-overlay svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #overflow-wrap {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    #mapContainer {
      width: 100%;
      height: 100%;
      position: relative;
      background: #555;
    }

    #mapContainer svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .gps-marker-original {
      position: absolute;
      top: 37.5%;
      left: 43.75%;
      width: 64px;
      height: 64px;
      transform: rotateX(50deg);
      z-index: 30;
      pointer-events: none;
    }

    .gps-marker-original svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.45));
    }

    .gps-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 0%, transparent 62%, rgba(0, 0, 0, 0.28) 100%),
        linear-gradient(to bottom, rgba(255,255,255,0.08), transparent 22%, transparent 78%, rgba(0,0,0,0.18));
    }

    .gear-screen {
      position: absolute;
      top: 7.5vh;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(70px, 6vw, 100px);
      height: clamp(70px, 6vw, 100px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background:
        radial-gradient(circle, #242c39 0%, #0a0e15 72%);
      border: 2px solid rgba(235, 240, 248, 0.22);
      box-shadow:
        0 0 26px rgba(255, 255, 255, 0.08),
        inset 0 0 20px rgba(255, 255, 255, 0.045);
      font-size: clamp(36px, 3.4vw, 58px);
      font-weight: 300;
    }

    .center-info {
      position: absolute;
      bottom: 5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 3.2vw;
      z-index: 20;
      color: rgba(220, 228, 240, 0.82);
      font-size: clamp(13px, 1.2vw, 22px);
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
  </style>

      </div>

  <script src="/ui/ui-vue/src/services/navigator-class.js"></script>
  <script>
    setTimeout(function () {
      var gps = document.querySelector(".gps-screen");

      if (typeof bngNavigator !== "undefined" && gps) {
        window.map = new bngNavigator({
          container: "#mapContainer",
          clock: "#timeText",
          backgroundRgb: [85, 85, 85],
          roadColors: ["#D8D8D8FF", "#969678FF", "#967864FF"],
          offsetX: gps.clientWidth / 2,
          offsetY: gps.clientHeight / 2,
          pitch: 65,
          speedPitch: 3
        });
      }
    }, 500);
  </script>
