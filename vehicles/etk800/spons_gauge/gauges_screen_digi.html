<html ng-app="gaugesScreen">

<head>
  <meta charset="UTF-8">
  <script>
    if (typeof beamng !== 'undefined') {
    }
    else { //for vueService
      var beamng = {}
      beamng.sendEngineLua = function () { }
    }
  </script>
  <!-- Vue START (needed for UiUnits / vueEventBus) -->
  <script src="/ui/lib/ext/vue3/vue.global.prod.js"></script>
  <script src="/ui/lib/ext/tiny-emitter/tinyemitter.js"></script>
  <script type="module" src="/ui/lib/int/vueService_mod.js"></script>
  <!-- Vue END -->
  <script src="/ui/lib/ext/angular/angular.js"></script>
  <script src="gauges_screen_digi.js"></script>
  <link type="text/css" rel="stylesheet" href="dashboard-components.css">

  <link rel="stylesheet" type="text/css" href="/ui/ui-vue/src/styles/other/navigator.css" />
  <script src="/ui/ui-vue/src/services/navigator-class.js"></script>
  <script src="fake-gps.js"></script>
</head>

<body ng-controller="GaugesScreenController as gaugeCtrl">

  <!-- safe area: the dash screen mesh is a flatter oval than the texture,
       so everything is drawn inside this inset box -->
  <div id="screenFit">

    <!-- navigator map band, centre, edges fade into the background -->
    <div class="map-band">
      <div class="map-band-y">
        <fake-gps class="gps-screen"></fake-gps>
      </div>
      <div class="map-vignette"></div>
    </div>

    <!-- BMW-style cluster overlay (built by bmw-cluster.js) -->
    <div id="clusterHost"></div>

  </div>

  <script src="bmw-cluster.js"></script>
</body>
</html>
